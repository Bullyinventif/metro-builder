<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Éditeur — Metro Builder</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/game.css?v=3">
</head>
<body class="game">
  <canvas id="map" aria-label="Carte du réseau de métro"></canvas>

  <!-- Haut gauche : menu + ville -->
  <div class="top-left">
    <a class="icon-btn round glass" href="index.html" id="home-btn" title="Menu principal" aria-label="Menu principal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5L12 3.5l8.5 7"/><path d="M5.5 9v10a1.5 1.5 0 0 0 1.5 1.5h3.5v-6h3v6H17a1.5 1.5 0 0 0 1.5-1.5V9"/></svg>
    </a>
    <div class="city-pill glass">
      <span class="city-pill-name" id="city-name">Ville</span>
      <span class="city-pill-mode">Mode créatif</span>
    </div>
  </div>

  <!-- Barre verticale des lignes -->
  <aside class="line-bar glass" aria-label="Lignes de métro">
    <div class="line-list" id="line-list"></div>
    <button class="line-add" id="add-line" type="button" title="Ajouter une ligne" aria-label="Ajouter une ligne">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </aside>

  <!-- Sélecteur de couleur de la ligne active -->
  <div class="color-picker glass" id="color-picker" role="dialog" aria-label="Couleur de la ligne" aria-hidden="true"></div>

  <!-- Aide contextuelle -->
  <div class="hint glass" id="hint"></div>

  <!-- Haut droite : actions -->
  <div class="top-actions glass">
    <button class="icon-btn" id="undo-btn" type="button" title="Annuler (Ctrl+Z)" aria-label="Annuler">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="icon-btn" id="redo-btn" type="button" title="Rétablir (Ctrl+Y)" aria-label="Rétablir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <span class="sep"></span>
    <button class="icon-btn active" id="labels-btn" type="button" title="Afficher les noms des arrêts" aria-label="Noms des arrêts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h11v2"/><path d="M9.5 5v14"/><path d="M7.5 19h4"/><path d="M14 13v-1.5h6V13"/><path d="M17 11.5V19"/><path d="M15.8 19h2.4"/></svg>
    </button>
    <button class="icon-btn" id="fit-btn" type="button" title="Recentrer la carte" aria-label="Recentrer la carte">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9"/><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/><path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
    <button class="icon-btn" id="export-btn" type="button" title="Exporter / partager ce réseau" aria-label="Exporter ce réseau">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8"/><path d="M4 14v4.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V14"/></svg>
    </button>
    <button class="icon-btn" id="import-btn" type="button" title="Importer un réseau (code ou lien)" aria-label="Importer un réseau">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5V15M7.5 11L12 15.5 16.5 11"/><path d="M4 14v4.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V14"/></svg>
    </button>
    <button class="icon-btn" id="reset-btn" type="button" title="Réinitialiser la carte" aria-label="Réinitialiser la carte">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
    </button>
    <button class="icon-btn" id="rules-btn" type="button" title="Règles du réseau" aria-label="Règles du réseau">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5"/><path d="M3.5 12l1.2 1.2L7 11"/><path d="M3.5 18l1.2 1.2L7 17"/></svg>
    </button>
  </div>

  <!-- Panneau des règles -->
  <section class="rules-panel glass" id="rules-panel" aria-live="polite">
    <header class="rules-head" id="rules-head">
      <div>
        <h2>Règles du réseau</h2>
        <span class="rules-status" id="rules-status"></span>
      </div>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </header>
    <ul class="rules-list" id="rules-list"></ul>
    <footer class="rules-stats" id="rules-stats"></footer>
  </section>

  <!-- Fenêtre export / import -->
  <div class="sheet-backdrop" id="share-sheet" hidden>
    <div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title">Partager le réseau</h2>
        <button class="icon-btn" id="sheet-close" type="button" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="sheet-tabs" role="tablist">
        <button type="button" role="tab" class="sheet-tab active" data-tab="export" aria-selected="true">Exporter</button>
        <button type="button" role="tab" class="sheet-tab" data-tab="import" aria-selected="false">Importer</button>
      </div>

      <section class="sheet-panel" data-panel="export">
        <p class="sheet-help">Envoyez ce lien à vos proches : le réseau s’ouvre directement dans le jeu.</p>
        <label class="sheet-label" for="export-link">Lien à partager</label>
        <div class="sheet-row">
          <input id="export-link" class="sheet-input" type="text" readonly>
          <button class="btn btn-small btn-primary" id="copy-link" type="button">Copier</button>
        </div>
        <label class="sheet-label" for="export-code">Ou le code texte</label>
        <textarea id="export-code" class="sheet-text" readonly rows="4"></textarea>
        <div class="sheet-row">
          <button class="btn btn-small" id="copy-code" type="button">Copier le code</button>
        </div>
      </section>

      <section class="sheet-panel" data-panel="import" hidden>
        <p class="sheet-help">Collez un lien ou un code reçu. Le réseau actuel de cette ville sera remplacé (Ctrl+Z pour annuler).</p>
        <label class="sheet-label" for="import-input">Lien ou code</label>
        <textarea id="import-input" class="sheet-text" rows="5" placeholder="https://…/game.html#m=… ou MBZ1.…" spellcheck="false"></textarea>
        <p class="sheet-msg" id="import-msg" role="alert"></p>
        <div class="sheet-row">
          <button class="btn btn-small btn-primary" id="import-go" type="button">Importer</button>
        </div>
      </section>
    </div>
  </div>

  <!-- Barre d'outils -->
  <nav class="toolbar glass" aria-label="Outils">
    <button class="tool-btn active" data-tool="cursor" type="button" title="Curseur — poser, déplacer, relier des arrêts (V)" aria-label="Curseur">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.8v15.6c0 .7.8 1 1.3.6l3.6-3.4 2.4 5.3c.2.5.8.7 1.3.5l1.8-.8c.5-.2.7-.8.5-1.3l-2.4-5.2 4.9-.4c.7 0 1-.9.5-1.4L7.3 3.2C6.8 2.8 6 3.1 6 3.8z"/></svg>
    </button>
    <button class="tool-btn" data-tool="point" type="button" title="Point — ajouter un pli ou changer le style d’une liaison (P)" aria-label="Point de pli">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l6-9 6 6 6-9"/><circle cx="9" cy="9" r="2.6" fill="currentColor"/><circle cx="15" cy="15" r="2.6" fill="#fff"/></svg>
    </button>
    <button class="tool-btn" data-tool="move" type="button" title="Déplacement — se déplacer et zoomer (M)" aria-label="Déplacement">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>
    </button>
    <button class="tool-btn" data-tool="eraser" type="button" title="Gomme — effacer arrêts, liaisons et points (E)" aria-label="Gomme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 20H20"/><path d="M4.6 14.6l9.9-9.9a2 2 0 0 1 2.8 0l2.5 2.5a2 2 0 0 1 0 2.8L11 18.8a4 4 0 0 1-2.8 1.2H7.6a2 2 0 0 1-1.4-.6l-1.6-1.6a2.2 2.2 0 0 1 0-3.2z"/><path d="M9 10.2l5.3 5.3"/></svg>
    </button>
    <span class="sep"></span>
    <button class="play-btn" id="play-btn" type="button" title="Lecture (Espace)" aria-label="Lecture">
      <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.52.85l10.4-6.5a1 1 0 0 0 0-1.7L9.52 4.65A1 1 0 0 0 8 5.5z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>
    </button>
  </nav>

  <!-- Choix pour une liaison (outil Point) -->
  <div class="popover glass" id="seg-popover" role="menu">
    <button type="button" data-action="bend" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 18L12 7l9 11"/><circle cx="12" cy="7" r="3" fill="#fff"/></svg>
      <span>Point</span>
    </button>
    <button type="button" data-action="straight" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 18L20 6"/></svg>
      <span>Droit</span>
    </button>
    <button type="button" data-action="curve" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 18C6 8 14 4 20 6"/></svg>
      <span>Courbe</span>
    </button>
    <button type="button" data-action="zigzag" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l3-6 3 6 3-6 3 6 3-6 3 6"/></svg>
      <span>Zigzag</span>
    </button>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/cities.js?v=3"></script>
  <script src="js/rules.js?v=3"></script>
  <script src="js/share.js?v=3"></script>
  <script src="js/game.js?v=3"></script>
</body>
</html>
